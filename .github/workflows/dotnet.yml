name: .NET toolkit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore CodeMetricsToolkit.sln --locked-mode --disable-parallel -m:1

      - name: Build Release
        run: dotnet build CodeMetricsToolkit.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test CodeMetricsToolkit.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  package-smoke:
    name: Pack and install tool
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore CodeMetricsToolkit.sln --locked-mode --disable-parallel -m:1

      - name: Build Release
        run: dotnet build CodeMetricsToolkit.sln --configuration Release --no-restore

      - name: Pack tool
        run: >-
          dotnet pack src/CodeMetricsToolkit.Cli/CodeMetricsToolkit.Cli.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Pack optional scoring library
        run: >-
          dotnet pack src/CodeMetricsToolkit.Scoring/CodeMetricsToolkit.Scoring.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Install and smoke-test package
        run: bash eng/verify-tool-package.sh artifacts/packages

      - name: Consume scoring package
        run: bash eng/verify-scoring-package.sh artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: codemetrics-nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
